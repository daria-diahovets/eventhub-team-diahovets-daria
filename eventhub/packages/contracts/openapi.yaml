openapi: 3.1.0

info:
  title: EventHub API
  version: 0.1.0
  description: Портал продажу квитків на події

servers:
  - url: http://localhost:4010
    description: Мок-сервер Prism
  - url: http://localhost:3000
    description: Локальний api-gateway

paths:
  /events:
    get:
      operationId: listEvents
      summary: Список подій із курсорною пагінацією
      tags: [catalog]
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
            examples: [Вінниця]
        - name: category
          in: query
          required: false
          description: Категорія події
          schema:
            type: string
            examples: [concert]
        - name: q
          in: query
          required: false
          description: Пошук за назвою події (підрядок, без урахування регістру)
          schema:
            type: string
            examples: [джаз]
        - name: from
          in: query
          required: false
          description: Показати події, що починаються не раніше цієї дати
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Показати події, що починаються не пізніше цієї дати
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          description: Непрозорий курсор із попередньої відповіді
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Сторінка подій
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
              examples:
                filled:
                  summary: Сторінка з подіями
                  value:
                    items:
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                        title: Симфонічний вечір
                        category: concert
                        status: scheduled
                        startsAt: "2026-10-12T19:00:00Z"
                        endsAt: "2026-10-12T21:30:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                          name: Філармонія
                          city: Вінниця
                        minPrice: { amount: 25000, currency: UAH }
                        availableSeats: 143
                      - id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8ea0
                        title: Джазовий квартет
                        category: concert
                        status: scheduled
                        startsAt: "2026-10-19T20:00:00Z"
                        venue:
                          id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e01
                          name: Клуб «Підвал»
                          city: Вінниця
                        minPrice: { amount: 18000, currency: UAH }
                        availableSeats: 12
                    nextCursor: "MjAyNi0xMC0xOVQyMDowMDowMFo"
                empty:
                  summary: Порожній каталог
                  value:
                    items: []
                    nextCursor: null
        "400":
          $ref: "#/components/responses/BadRequest"

  /events/{eventId}:
    get:
      operationId: getEvent
      summary: Одна подія
      tags: [catalog]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Подія
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                default:
                  value:
                    id: 018f2c1e-4a7b-7c3d-9e1f-2a5b6c7d8e9f
                    title: Симфонічний вечір
                    description: Програма з творів Лисенка та Дворжака
                    category: concert
                    status: scheduled
                    imageUrl: https://example.com/images/symphony-evening.jpg
                    startsAt: "2026-10-12T19:00:00Z"
                    endsAt: "2026-10-12T21:30:00Z"
                    venue:
                      id: 018f2c1e-0000-7c3d-9e1f-2a5b6c7d8e00
                      name: Філармонія
                      city: Вінниця
                    minPrice: { amount: 25000, currency: UAH }
                    availableSeats: 143
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{eventId}/seats:
    get:
      operationId: listSeats
      summary: Карта місць події
      tags: [catalog]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Місця події
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      operationId: listMyOrders
      summary: Замовлення поточного користувача
      tags: [orders]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Список замовлень, найновіші першими
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createOrder
      summary: Створити замовлення й зарезервувати місця
      description: >-
        Оплати ще немає (див. тиждень 8): замовлення переходить у статус
        pending і тримає місця зарезервованими протягом ORDER_HOLD_MINUTES.
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "200":
          description: Повтор із тим самим Idempotency-Key - наявне замовлення
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "201":
          description: Замовлення створено, місця зарезервовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SeatsUnavailable"
        "422":
          description: Ключ ідемпотентності вже використано з іншим тілом запиту
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Переглянути замовлення
      description: Чуже замовлення - 404, не 403 (методичка ЛР6, ADR-0006).
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Замовлення
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Скасувати замовлення
      description: >-
        Лише власник і лише зі стану pending. Місця повертаються у free,
        лічильник availableSeats відновлюється.
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Замовлення скасовано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Замовлення вже не очікує оплати
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                orderState:
                  value:
                    type: /errors/order-state
                    title: Замовлення вже не очікує оплати
                    status: 409

  /reports/revenue:
    get:
      operationId: getRevenueReport
      summary: Звіт організатора - продані місця й виручка на кожну подію
      tags: [reports]
      responses:
        "200":
          description: Один рядок на подію, однин запит до бази
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRevenue"

  /auth/register:
    post:
      operationId: registerUser
      summary: Зареєструвати користувача
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Користувача створено, видано пару токенів
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Пошта вже зареєстрована
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                emailTaken:
                  value:
                    type: /errors/email-taken
                    title: Ця пошта вже зареєстрована
                    status: 409

  /auth/login:
    post:
      operationId: loginUser
      summary: Увійти
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Видано пару токенів
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/InvalidCredentials"

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Обміняти refresh-токен (з cookie) на нову пару
      tags: [auth]
      responses:
        "200":
          description: Нова пара токенів, refresh-cookie оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh-токен відсутній, протермінований або вже використаний
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/logout:
    post:
      operationId: logoutUser
      summary: Вийти (відкликати поточний ланцюжок refresh-токенів)
      tags: [auth]
      responses:
        "204":
          description: Сесію завершено, refresh-cookie очищено

  /auth/logout-all:
    post:
      operationId: logoutAllDevices
      summary: Вийти з усіх пристроїв (відкликати всі ланцюжки refresh-токенів користувача)
      description: Потребує заголовок Authorization з access-токеном.
      tags: [auth]
      responses:
        "204":
          description: Усі сесії користувача завершено
        "401":
          description: Відсутній, протермінований або підроблений access-токен
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Поточний користувач
      description: Потребує заголовок Authorization з access-токеном.
      tags: [auth]
      responses:
        "200":
          description: Дані поточного користувача
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Відсутній, протермінований або підроблений access-токен
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /organizer/events:
    get:
      operationId: listOrganizerEvents
      summary: Події поточного організатора (адміністратор бачить усі)
      description: Потребує заголовок Authorization з роллю organizer або admin.
      tags: [organizer]
      responses:
        "200":
          description: Список подій
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrganizerEvent
      summary: Створити подію
      description: >-
        organizerId береться з access-токена, а не з тіла запиту.
        Потребує заголовок Authorization з роллю organizer або admin.
      tags: [organizer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Подію створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /organizer/events/{eventId}:
    patch:
      operationId: updateOrganizerEvent
      summary: Оновити власну подію
      description: >-
        Чужа подія (або подія, якої не існує) повертає 404 - не 403,
        щоб не підтверджувати факт її існування. Потребує заголовок
        Authorization з роллю organizer або admin.
      tags: [organizer]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Подію оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Event:
      type: object
      required: [id, title, category, status, startsAt, venue, minPrice, availableSeats]
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string }
        category:    { type: string }
        imageUrl:    { type: string, format: uri }
        status:
          type: string
          enum: [scheduled, cancelled]
          description: >-
            scheduled - подія відбудеться; cancelled - організатор скасував
            подію, нові замовлення на неї неможливі (див. POST /orders, 410).
        startsAt:    { type: string, format: date-time }
        endsAt:      { type: string, format: date-time }
        venue:       { $ref: "#/components/schemas/VenueSummary" }
        minPrice:    { $ref: "#/components/schemas/Money" }
        availableSeats: { type: integer, minimum: 0 }

    VenueSummary:
      type: object
      required: [id, name, city]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }
        city: { type: string }

    Money:
      type: object
      required: [amount, currency]
      description: Сума в мінімальних одиницях валюти (копійках)
      properties:
        amount:   { type: integer }
        currency: { type: string, enum: [UAH] }

    EventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        nextCursor:
          type: [string, "null"]
          description: Курсор наступної сторінки; null — сторінок більше немає

    Seat:
      type: object
      required: [id, rowLabel, number, price, available]
      properties:
        id:       { type: string, format: uuid }
        rowLabel: { type: string }
        number:   { type: integer, minimum: 1 }
        price:    { $ref: "#/components/schemas/Money" }
        available:
          type: boolean
          description: >-
            Чи можна зараз це місце замовити. Внутрішні стани (FREE, HELD,
            SOLD) назовні не віддаємо - лише "можна/не можна".

    SeatMap:
      type: object
      required: [eventId, seats]
      properties:
        eventId: { type: string, format: uuid }
        seats:
          type: array
          items: { $ref: "#/components/schemas/Seat" }

    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, EXPIRED, REFUNDED]

    OrderItem:
      type: object
      required: [seatId, rowLabel, number, price]
      properties:
        seatId:   { type: string, format: uuid }
        rowLabel: { type: string }
        number:   { type: integer }
        price:    { $ref: "#/components/schemas/Money" }

    Order:
      type: object
      required: [id, eventId, status, total, holdExpiresAt, createdAt, items]
      properties:
        id:         { type: string, format: uuid }
        eventId:    { type: string, format: uuid }
        eventTitle: { type: string }
        status:     { $ref: "#/components/schemas/OrderStatus" }
        total:      { $ref: "#/components/schemas/Money" }
        holdExpiresAt:
          type: string
          format: date-time
          description: Момент, до якого місця зарезервовані
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    CreateOrderRequest:
      type: object
      required: [eventId, seatIds]
      properties:
        eventId: { type: string, format: uuid }
        seatIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: string, format: uuid }

    EventRevenue:
      type: object
      required: [eventId, title, soldSeats, revenue]
      properties:
        eventId:   { type: string, format: uuid }
        title:     { type: string }
        soldSeats: { type: integer, minimum: 0 }
        revenue:   { $ref: "#/components/schemas/Money" }

    User:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:        { type: string, format: uuid }
        email:     { type: string, format: email }
        role:
          type: string
          enum: [user, organizer, admin]
        createdAt: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user:        { $ref: "#/components/schemas/User" }

    CreateEventRequest:
      type: object
      required: [title, category, startsAt, venueId, minPriceCents]
      properties:
        title:          { type: string, minLength: 1, maxLength: 200 }
        description:    { type: string, minLength: 1, maxLength: 2000 }
        category:       { type: string, minLength: 1, maxLength: 50 }
        imageUrl:       { type: string, format: uri }
        startsAt:       { type: string, format: date-time }
        endsAt:         { type: string, format: date-time }
        venueId:        { type: string, format: uuid }
        minPriceCents:  { type: integer, minimum: 0 }
        availableSeats: { type: integer, minimum: 0, default: 0 }

    UpdateEventRequest:
      type: object
      description: Усі поля необов'язкові - оновлюються лише надані.
      properties:
        title:          { type: string, minLength: 1, maxLength: 200 }
        description:    { type: string, minLength: 1, maxLength: 2000 }
        category:       { type: string, minLength: 1, maxLength: 50 }
        imageUrl:       { type: string, format: uri }
        startsAt:       { type: string, format: date-time }
        endsAt:         { type: string, format: date-time }
        venueId:        { type: string, format: uuid }
        minPriceCents:  { type: integer, minimum: 0 }
        availableSeats: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [scheduled, cancelled]

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:     { type: string }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        seatIds:
          type: array
          items: { type: string, format: uuid }
          description: Лише для /errors/seats-unavailable - які місця вже зайняті.

  responses:
    BadRequest:
      description: Некоректні параметри запиту
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            invalidLimit:
              value:
                type: /errors/invalid-query
                title: Некоректний параметр запиту
                status: 400
                detail: "Параметр limit має бути в межах 1..50"

    NotFound:
      description: Ресурс не знайдено
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            eventNotFound:
              value:
                type: /errors/not-found
                title: Подію не знайдено
                status: 404
            orderNotFound:
              value:
                type: /errors/not-found
                title: Замовлення не знайдено
                status: 404
                detail: >-
                  Замовлення з таким id не існує, або наданий
                  cancellationToken йому не відповідає

    Unauthenticated:
      description: Відсутній, протермінований або підроблений access-токен
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            unauthenticated:
              value:
                type: /errors/unauthenticated
                title: Необхідна автентифікація
                status: 401

    Forbidden:
      description: Автентифіковано, але роль не дозволяє цю дію
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            forbidden:
              value:
                type: /errors/forbidden
